[project]
name = "moss-partner-sdk"
version = "0.1.0"
description = "Python SDK for MOSS Partner API - Manage customers, configure governance, and monitor compliance"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
authors = [
    { name = "MOSS Computing", email = "support@mosscomputing.com" }
]
keywords = ["moss", "ai-governance", "partner-api", "sdk", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0; python_version < '3.10'",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mosscomputing/moss-partner-sdk-py"
Documentation = "https://docs.mosscomputing.com/sdks/python"
Repository = "https://github.com/mosscomputing/moss-partner-sdk-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moss_partner_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
