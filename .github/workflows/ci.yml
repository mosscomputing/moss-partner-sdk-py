name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: ruff check src tests

      - name: Run type checker
        run: mypy src --ignore-missing-imports

      - name: Run unit tests
        run: pytest tests/ -v -m "not integration"

      - name: Build distribution
        run: python -m build

      - name: Verify build output
        run: |
          test -f dist/*.whl
          test -f dist/*.tar.gz

  integration:
    name: Integration Tests (Production API)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          MOSS_PARTNER_KEY: ${{ secrets.MOSS_PARTNER_KEY }}
          MOSS_BASE_URL: https://api.mosscomputing.com
        run: pytest tests/ -v -m integration
        continue-on-error: true

      - name: Report integration test results
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Integration tests passed"
          else
            echo "⚠️  Integration tests failed or skipped (check if MOSS_PARTNER_KEY is set)"
          fi

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
